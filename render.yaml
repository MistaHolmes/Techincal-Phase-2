services:
  - type: web
    name: draftdock-admin-backend
    runtime: node
    plan: free
    region: oregon
    # Run from root, using the workspace
    buildCommand: npm install && npx prisma generate --schema=apps/admin/server/prisma/schema.prisma
    startCommand: node apps/admin/server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draftdock-admin-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_JWT_SECRET
        generateValue: true # Render will generate a random secret

databases:
  - name: draftdock-admin-db
    plan: free
