services:
  - type: web
    name: draftdock-admin-backend
    env: docker
    plan: free
    region: oregon
    rootDir: apps/admin
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draftdock-admin-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_JWT_SECRET
        generateValue: true # Render will generate a random secret

databases:
  - name: draftdock-admin-db
    plan: free
